# Example: run Skool automations on a schedule with GitHub Actions.
# 1. Add COTLET_API_KEY under Settings > Secrets and variables > Actions.
# 2. Set SKOOL_GROUP below, uncomment `schedule`, and switch off confirmation
#    for approve_membership_request in the Cotlet dashboard.
name: Skool daily

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 8 * * *"

env:
  SKOOL_GROUP: yourgroup

jobs:
  skool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Approve membership requests that mention a business
        env:
          COTLET_API_KEY: ${{ secrets.COTLET_API_KEY }}
        run: python approve_membership_requests.py --group "$SKOOL_GROUP" --match business --match agency
      - name: Weekly stats
        env:
          COTLET_API_KEY: ${{ secrets.COTLET_API_KEY }}
        run: python group_stats.py --group "$SKOOL_GROUP" --period 7d
